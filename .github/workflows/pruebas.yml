# Corre las pruebas en cada cambio. Si algo se rompe, el PR muestra una ✗ roja antes de fusionarlo.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Servicio de Google (apps-script/Code.gs)
        run: node tests/servicio.test.js
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: App completa en un navegador con tamaño de celular
        run: node tests/app.e2e.js
